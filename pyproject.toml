[project]
name = "earthdata"
version = "1.0.0"
description = "EarthData - Earth observation data ingestion and processing platform"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [{ name = "EarthData Engineering" }]

dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "sqlalchemy>=2.0.36,<3.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "psycopg2-binary>=2.9.10,<3.0.0",
    "alembic>=1.14.0,<2.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "tenacity>=9.0.0,<10.0.0",
    "python-json-logger>=2.0.7,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "black>=24.10.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "respx>=0.21.0",
    "pytest-postgresql>=6.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "C4", "SIM", "N", "ASYNC", "RUF",
]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["earthdata"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=earthdata --cov-report=term-missing --cov-report=xml --cov-report=html --cov-fail-under=100"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/earthdata"]
omit = ["*/tests/*"]
# SQLAlchemy's async engine bridges to sync DBAPI drivers via greenlet;
# without this, lines after a second greenlet switch within the same
# coroutine go unrecorded even though they demonstrably execute. FastAPI
# also runs plain `def` dependency providers via a threadpool, hence "thread".
concurrency = ["greenlet", "thread"]
