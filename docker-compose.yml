services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: earthdata
      POSTGRES_PASSWORD: earthdata
      POSTGRES_DB: earthdata
    ports:
      - "5432:5432"
    volumes:
      - earthdata_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U earthdata"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: runtime
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://earthdata:earthdata@db:5432/earthdata
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  earthdata_pgdata:
